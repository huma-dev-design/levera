<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LEVERA Website</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="LEVERA finds, vets and introduces experienced, English-fluent global professionals for growing businesses.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..600&family=Geist:wght@300..700&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400;500&display=swap">
<style>
:root{
  /* Layout: wide single column, copy left and imagery right, light pages broken by LEVERA-green bands. */
  --white:#FFFFFF; --panel:#F3F5F1; --ink:#13201A; --ink-2:#4A554E; --ink-3:#7A827C;
  --line:#E4E7E1; --green:#234429; --green-2:#2C5534; --green-soft:#E7EEE7; --brass:#B59255; --gold:#8C6D3A; --gold-hi:#CDAA6C; --parch:#E9E2D3;
  --ok:#2E7D4F; --ok-bg:#E5F0E8; --wait:#93660F; --wait-bg:#F6EDDA; --err:#B4432C;
  --f:"Geist","Helvetica Neue",Arial,sans-serif; --f-serif:"Fraunces",Georgia,"Times New Roman",serif;
  --ease:cubic-bezier(.2,.7,.1,1);
  color-scheme:light;
}
:root:lang(ko){--f:"Geist","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;--f-serif:"Noto Serif KR","Fraunces",Georgia,serif}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth;scroll-padding-top:84px}
body{margin:0;background:var(--white);color:var(--ink);font-family:var(--f);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
:lang(ko) body{word-break:keep-all;line-height:1.7}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--white)}
img{max-width:100%;display:block}
.page{container:page / inline-size;overflow-x:clip}
.wrap{max-width:1280px;margin-inline:auto;padding-left:max(clamp(16px,4cqi,48px),env(safe-area-inset-left,0px));padding-right:max(clamp(16px,4cqi,48px),env(safe-area-inset-right,0px))}
p{margin:0}
h1,h2,h3,h4{margin:0;font-weight:500;text-wrap:balance}
h1,h2,h3{font-family:var(--f-serif);font-weight:400;font-optical-sizing:auto}
h1 em,h2 em{font-style:italic;font-weight:400;color:var(--gold)}
:lang(ko) h1 em,:lang(ko) h2 em{font-style:normal}
:lang(ko) h1,:lang(ko) h2{letter-spacing:-.02em!important;line-height:1.25!important}
.calc-sec h2 em,.close h2 em{color:var(--gold-hi)}
h2{font-size:clamp(2.2rem,4.1cqi,3.5rem);line-height:1.06;letter-spacing:-.022em}
:lang(ko) h2{font-size:clamp(1.8rem,3.3cqi,2.8rem)}
h3{font-size:1.3rem;line-height:1.25;letter-spacing:-.005em}
.sub{color:var(--ink-2);max-width:34em;text-wrap:pretty}
.fine{font-size:.82rem;color:var(--ink-3);line-height:1.5;max-width:52em}
a{color:inherit}
:focus-visible{outline:2px solid var(--green);outline-offset:3px;border-radius:8px}
.sec{padding-block:clamp(80px,9.5cqi,128px)}
.sec-head{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:32px;align-items:end;margin-bottom:52px}
.sec-head .sub{justify-self:end}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 24px;border-radius:999px;border:1px solid transparent;font:500 .95rem/1.2 var(--f);text-decoration:none;cursor:pointer;text-align:center;transition:background .25s,border-color .25s,color .25s,transform .25s var(--ease),box-shadow .25s}
.btn:active{transform:scale(.98)}
.btn-green{background:var(--green);color:#fff}
.btn-green:hover{background:var(--green-2);box-shadow:0 10px 24px -12px rgba(35,68,41,.7)}
.btn-line{background:#fff;border-color:var(--line);color:var(--ink)}
.btn-line:hover{border-color:var(--green);color:var(--green)}
.btn-light{background:#fff;color:var(--green)}
.btn-light:hover{background:var(--parch)}

/* nav */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:rgba(255,255,255,.92);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid transparent;transition:border-color .3s}
.nav.scrolled{border-bottom-color:var(--line)}
.nav-in{display:flex;align-items:center;gap:28px;height:72px;position:relative}
.logo{display:inline-flex;align-items:center;text-decoration:none;flex:none}
.logo img{height:40px;width:auto}
.links{display:flex;gap:26px;list-style:none;margin:0 0 0 auto;padding:0}
.links a{text-decoration:none;font-size:.94rem;color:var(--ink-2);position:relative;padding:4px 0;transition:color .2s;white-space:nowrap}
.links a::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:1.5px;background:var(--green);transform:scaleX(0);transform-origin:left;transition:transform .35s var(--ease)}
.links a:hover{color:var(--green)}
.links a:hover::after{transform:scaleX(1)}
.lang{display:inline-flex;padding:3px;border-radius:999px;border:1px solid var(--line);background:#fff;flex:none}
.lang button{border:0;background:transparent;font:500 .82rem var(--f);font-family:"Geist","Noto Sans KR",sans-serif;padding:6px 11px;border-radius:999px;cursor:pointer;color:var(--ink-2);transition:background .2s,color .2s}
.lang button[aria-pressed="true"]{background:var(--green);color:#fff}
.nav .btn{min-height:42px;padding:0 18px;font-size:.9rem;white-space:nowrap}
.menu{display:none;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:#fff;cursor:pointer;place-items:center;color:var(--green);flex:none}
.menu svg{width:20px;height:20px}
.m-only{display:none}

/* hero */
.hero{padding-block:clamp(40px,5cqi,72px) clamp(56px,6cqi,88px)}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:clamp(32px,5cqi,72px);align-items:center}
.hero h1{font-size:clamp(2.5rem,4.3cqi,3.95rem);line-height:1.03;letter-spacing:-.03em}
:lang(ko) .hero h1{font-size:clamp(2.1rem,3.9cqi,3.5rem)}
.hero h1 .l{display:block}
.hero h1 .soft{color:var(--green)}
.hero .sub{font-size:1.12rem;margin-top:24px;max-width:31em}
.hero .terms{margin-top:14px;font-weight:500;color:var(--green);display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.98rem}
.hero .terms span{display:inline-flex;align-items:center;gap:8px}
.hero .terms svg{width:16px;height:16px;stroke:var(--gold);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}
.hero .fine{margin-top:16px}
.persona{margin-top:32px;padding-top:22px;border-top:1px solid var(--line)}
.persona p{font-size:.9rem;color:var(--ink-3);margin-bottom:12px}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{display:inline-flex;align-items:center;gap:8px;padding:5px 14px 5px 5px;border-radius:999px;border:1px solid var(--line);background:#fff;font:500 .88rem var(--f);color:var(--ink-2);cursor:pointer;transition:border-color .2s,background .2s,color .2s}
.seg button img{width:28px;height:28px;border-radius:50%;object-fit:cover}
.seg button:hover{border-color:var(--green);color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#fff}
.visual{position:relative;padding:0 0 40px 40px}
.photo{position:relative;border-radius:24px;overflow:hidden;aspect-ratio:4/4.3;max-width:100%;background:var(--panel)}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .6s var(--ease),transform 1.2s var(--ease)}
.photo img.out{opacity:0;transform:scale(1.04)}
.badge-top{position:absolute;top:18px;left:58px;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.94);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);padding:7px 14px;border-radius:999px;font-size:.82rem;font-weight:500}
.badge-top i{width:7px;height:7px;border-radius:50%;background:var(--brass)}
.done-card{position:absolute;left:0;bottom:0;width:min(350px,88%);background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 24px 50px -24px rgba(19,32,26,.35);z-index:2}
.dc-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:12px}
.dc-h strong{font-weight:500;font-size:.95rem}
.dc-h span{font-size:.76rem;color:var(--ink-3);white-space:nowrap}
.dc-list{list-style:none;margin:0;padding:0;display:grid;gap:9px}
.dc-list li{display:flex;gap:10px;align-items:center;font-size:.87rem;line-height:1.35;opacity:.35;transition:opacity .4s}
.dc-list li.on{opacity:1}
.tk{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;flex:none;transition:background .3s,border-color .3s}
.tk svg{width:11px;height:11px;stroke:#fff;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .4s var(--ease) .1s}
li.on .tk{background:var(--green);border-color:var(--green)}
li.on .tk svg{stroke-dashoffset:0}
li.flag.on .tk{background:var(--wait);border-color:var(--wait)}
.dc-foot{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:.8rem;color:var(--ink-3)}
.dc-foot b{font-size:1.25rem;font-weight:500;letter-spacing:-.02em;color:var(--green);font-variant-numeric:tabular-nums;white-space:nowrap}

/* tools */
.tools{border-block:1px solid var(--line);padding-block:20px;overflow:hidden}
.tools-in{display:flex;align-items:center;gap:40px}
.tools-in p{flex:none;font-size:.9rem;color:var(--ink-3);max-width:16em;line-height:1.4}
.track-wrap{overflow:hidden;flex:1;-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.track{display:flex;gap:48px;width:max-content;animation:mq 46s linear infinite}
.tools:hover .track{animation-play-state:paused}
.track span{font-size:1.25rem;font-weight:600;letter-spacing:-.02em;color:#9AA29C;white-space:nowrap;transition:color .2s;font-family:"Geist",sans-serif}
.track span.core{color:#6F7A72}
.track span:hover{color:var(--green)}

/* before/after */
.ba{position:relative;border-radius:24px;overflow:hidden;aspect-ratio:16/8;max-width:100%;user-select:none;touch-action:pan-y;background:#0d1410}
.ba img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ba .after{transform:scaleX(-1);clip-path:inset(0 var(--x,50%) 0 0)}
.ba-line{position:absolute;top:0;bottom:0;left:var(--x,50%);width:2px;background:#fff;transform:translateX(-1px);pointer-events:none}
.ba-knob{position:absolute;top:50%;left:var(--x,50%);width:52px;height:52px;border-radius:50%;background:#fff;transform:translate(-50%,-50%);display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.25);pointer-events:none;color:var(--green)}
.ba-knob svg{width:22px;height:22px}
.ba input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:ew-resize;margin:0}
.ba input:focus-visible ~ .ba-knob{outline:3px solid var(--brass);outline-offset:3px}
.tag-b,.tag-a{position:absolute;bottom:20px;background:rgba(255,255,255,.95);border-radius:14px;padding:12px 16px;max-width:310px;font-size:.88rem;line-height:1.4;pointer-events:none}
.tag-b{left:20px}.tag-a{right:20px;text-align:right}
.tag-b b,.tag-a b{display:block;font-size:1.3rem;font-weight:500;letter-spacing:-.02em}
.tag-b span,.tag-a span{color:var(--ink-2)}
.ba-note{display:flex;justify-content:space-between;gap:20px;margin-top:18px;font-size:.92rem;color:var(--ink-3)}
.ba-note span:last-child{text-align:right}

/* hand-off */
.handoff{background:var(--panel)}
.board{display:grid;grid-template-columns:290px minmax(0,1fr);gap:24px;align-items:start}
.tabs{list-style:none;margin:0;padding:0;display:grid;gap:2px;position:sticky;top:96px}
.tab{width:100%;display:flex;align-items:center;gap:12px;padding:11px 14px;border:0;border-radius:10px;background:transparent;font:400 .98rem var(--f);color:var(--ink-2);text-align:left;cursor:pointer;transition:background .2s,color .2s}
.tab svg{width:18px;height:18px;flex:none}
.tab:hover{color:var(--ink);background:rgba(35,68,41,.06)}
.tab[aria-selected="true"]{background:var(--green);color:#fff}
.tab .top-tag{margin-left:auto;font-size:.7rem;font-weight:500;padding:2px 7px;border-radius:999px;background:var(--wait-bg);color:var(--wait)}
.tab[aria-selected="true"] .top-tag{background:rgba(255,255,255,.16);color:#fff}
.pane{background:#fff;border:1px solid var(--line);border-radius:20px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);min-height:460px;overflow:hidden}
.pane.enter .pane-copy,.pane.enter .vig{animation:up .45s var(--ease) both}
.pane.enter .vig{animation-delay:.06s}
.pane-copy{padding:36px;display:flex;flex-direction:column;gap:16px}
.pane-copy h3{font-size:1.75rem;letter-spacing:-.015em}
.pane-copy .sub{font-size:.98rem}
.checks{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:10px;font-size:.95rem}
.checks li{display:flex;gap:10px;align-items:flex-start}
.checks svg{width:18px;height:18px;flex:none;margin-top:3px;stroke:var(--green);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.pane-foot{margin-top:auto;padding-top:16px;border-top:1px solid var(--line);font-size:.84rem;color:var(--ink-3)}
.vig{background:var(--green-soft);padding:28px;display:flex;align-items:center;justify-content:center}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;width:100%;max-width:400px;font-size:.84rem;box-shadow:0 14px 30px -18px rgba(19,32,26,.35)}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);font-weight:500}
.card-h span{font-weight:400;color:var(--ink-3);font-size:.76rem;white-space:nowrap}
.li{display:flex;align-items:center;gap:10px;padding:11px 14px;border-top:1px solid var(--line)}
.li:first-of-type{border-top:0}
.li .m{min-width:0;flex:1}
.li .m strong{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .m span{color:var(--ink-3);font-size:.76rem;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{font-size:.72rem;font-weight:500;padding:2px 8px;border-radius:999px;background:var(--panel);color:var(--ink-2);white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.w{background:var(--wait-bg);color:var(--wait)}
.cal{display:grid;grid-template-columns:40px repeat(4,1fr);gap:6px;padding:14px}
.cal span{font-size:.7rem;color:var(--ink-3)}
.cal .d{text-align:center}
.cal .slot{height:30px;border-radius:6px;background:var(--panel)}
.cal .slot.b{background:var(--green);color:#fff;font-size:.68rem;padding:4px 6px;line-height:1.2;overflow:hidden}
.cal .slot.f{background:#EEF3EF;border:1px dashed #B9CBBE}
.bub{padding:14px;display:grid;gap:8px}
.bub p{max-width:85%;padding:9px 12px;border-radius:12px;font-size:.82rem;line-height:1.4}
.bub .in{background:var(--panel)}
.bub .out{background:var(--green);color:#fff;justify-self:end}
.flow{padding:18px 14px;display:grid;gap:10px}
.node{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px}
.node i{width:26px;height:26px;border-radius:7px;background:var(--panel);display:grid;place-items:center;font-style:normal;font-size:.7rem;font-weight:600;color:var(--ink-2);flex:none}
.node.me{border-color:var(--green)}
.node.me i{background:var(--green);color:#fff}
.flow .arrow{height:14px;width:1px;background:var(--line);margin-left:25px}

/* reporting */
.rep{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:20px;align-items:start}
.sheet,.mail{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 1px 1px rgba(19,32,26,.04),0 20px 44px -28px rgba(19,32,26,.3)}
.sheet-h,.mail-h{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.sheet-h strong,.mail-h strong{font-weight:500}
.sheet-h span,.mail-h span{font-size:.8rem;color:var(--ink-3)}
.tasks-l{list-style:none;margin:0;padding:6px 8px}
.tasks-l li{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;transition:background .3s}
.tasks-l li.today{background:var(--green-soft)}
.tasks-l label{display:flex;align-items:center;gap:12px;flex:1;cursor:pointer;font-size:.92rem;min-width:0}
.tasks-l input{appearance:none;-webkit-appearance:none;width:20px;height:20px;border-radius:6px;border:1.5px solid #C9CFC9;margin:0;display:grid;place-items:center;cursor:pointer;flex:none;transition:background .2s,border-color .2s}
.tasks-l input:checked{background:var(--green);border-color:var(--green)}
.tasks-l input:checked::after{content:"";width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.tasks-l input:checked + span{color:var(--ink-3);text-decoration:line-through}
.tasks-l small{font-size:.76rem;color:var(--ink-3);white-space:nowrap}
.days{display:flex;gap:4px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.days button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font:500 .84rem var(--f);color:var(--ink-2);cursor:pointer;transition:all .2s}
.days button:hover{border-color:var(--green)}
.days button[aria-selected="true"]{background:var(--green);border-color:var(--green);color:#fff}
.mail-meta{padding:16px 20px 4px;font-size:.84rem;color:var(--ink-3);display:grid;gap:2px}
.mail-meta b{color:var(--ink);font-weight:500}
.mail-body{padding:8px 20px 22px;display:grid;gap:16px}
.mail-body.enter{animation:up .35s var(--ease) both}
.mail-body h4{font-size:.78rem;font-weight:500;color:var(--ink-3);margin-bottom:6px;font-family:var(--f)}
.mail-body ul{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:.92rem}
.mail-body li{display:flex;gap:10px;align-items:flex-start}
.mail-body li i{width:8px;height:8px;border-radius:50%;margin-top:8px;flex:none;background:var(--ok)}
.mail-body .p li i{background:var(--green);opacity:.4}
.mail-body .d li i{background:var(--wait)}
.mail-body .none{color:var(--ink-3);font-size:.9rem}
.rep-note{margin-top:20px}

/* calculator */
.calc-sec{background:var(--green);color:#fff}
.calc{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:stretch}
.calc-l{padding-right:clamp(0px,4cqi,56px);display:flex;flex-direction:column}
.calc-l .sub{margin-top:18px;color:rgba(255,255,255,.75)}
.fields{display:grid;gap:30px;margin-top:auto;padding-top:40px}
.f-top{display:flex;justify-content:space-between;align-items:baseline;gap:16px;margin-bottom:12px}
.f-top label,.f-top .lbl{font-weight:500;flex:1 1 auto;min-width:0}
.f-top output{font-size:1.5rem;font-weight:500;letter-spacing:-.02em;font-variant-numeric:tabular-nums;flex:none;font-family:"Geist",sans-serif}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:24px;background:transparent;cursor:pointer;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:3px;background:linear-gradient(90deg,#fff var(--p),rgba(255,255,255,.22) var(--p))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:#fff;border:0;margin-top:-10.5px;box-shadow:0 2px 8px rgba(0,0,0,.25);transition:transform .15s}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.15)}
input[type=range]::-moz-range-track{height:3px;background:rgba(255,255,255,.22);border-radius:3px}
input[type=range]::-moz-range-progress{height:3px;background:#fff;border-radius:3px}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#fff;border:0}
.sal{display:flex;flex-wrap:wrap;gap:8px}
.sal button{font:500 .95rem "Geist",sans-serif;padding:9px 18px;border-radius:999px;border:1px solid rgba(255,255,255,.3);background:transparent;color:#fff;cursor:pointer;transition:background .2s,border-color .2s,color .2s}
.sal button:hover,.sal button[aria-pressed="true"]{background:#fff;color:var(--green);border-color:#fff}
.calc-l .fine{color:rgba(255,255,255,.62);margin-top:26px}
.result{background:#fff;color:var(--ink);border-radius:22px;padding:clamp(28px,3.5cqi,44px);display:flex;flex-direction:column}
.k{font-size:.8rem;color:var(--ink-3)}
.r-big{font-size:clamp(4rem,7.4cqi,6.2rem);font-weight:500;letter-spacing:-.055em;line-height:.95;margin-top:10px;font-variant-numeric:tabular-nums;color:var(--green);font-family:"Geist",sans-serif}
.r-big small{font-size:1.3rem;letter-spacing:-.01em;color:var(--ink-3);margin-left:6px;font-family:var(--f)}
.r-sub{color:var(--ink-2);margin-top:12px}
.cmp{display:grid;gap:16px;margin:30px 0 22px}
.cmp-row{display:grid;gap:8px}
.cmp-row div{display:flex;justify-content:space-between;gap:10px;font-size:.92rem;color:var(--ink-2)}
.cmp-row b{font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.meter{height:8px;border-radius:8px;background:var(--panel);overflow:hidden}
.meter i{display:block;height:100%;border-radius:inherit;background:var(--green);transition:width .6s var(--ease)}
.meter.b i{background:var(--brass)}
.fee-row{display:flex;justify-content:space-between;gap:10px;padding:14px 16px;border-radius:12px;background:var(--panel);font-size:.92rem;color:var(--ink-2)}
.fee-row b{color:var(--ink);font-weight:500;white-space:nowrap}
.verdict{font-size:1.06rem;line-height:1.45;margin:22px 0 22px;max-width:26em}
.result .btn{align-self:flex-start;margin-top:auto}

/* steps */
.steps-wrap{position:relative}
.progress{position:absolute;left:0;right:0;top:15px;height:2px;background:var(--line);border-radius:2px;overflow:hidden}
.progress i{display:block;height:100%;width:var(--prog,0%);background:var(--green);transition:width .2s linear}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:20px;position:relative}
.step{padding-right:12px}
.step .n{width:32px;height:32px;border-radius:50%;background:#fff;border:1.5px solid var(--line);display:grid;place-items:center;font-size:.85rem;font-weight:500;color:var(--ink-3);transition:background .3s,border-color .3s,color .3s;font-family:"Geist",sans-serif}
.step.on .n{background:var(--green);border-color:var(--green);color:#fff}
.step h3{margin-top:24px;font-size:1.2rem}
.step p{color:var(--ink-2);margin-top:8px;font-size:.94rem}
.step .when{display:inline-block;margin-top:14px;font-size:.78rem;font-weight:500;color:var(--green);background:var(--green-soft);padding:4px 10px;border-radius:999px}
.steps-note{margin-top:30px}

/* people */
.people{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.person{border:1px solid var(--line);border-radius:20px;overflow:hidden;background:#fff;transition:transform .4s var(--ease),box-shadow .4s}
.person:hover,.person:focus-within{transform:translateY(-4px);box-shadow:0 24px 40px -28px rgba(19,32,26,.45)}
.ph{position:relative;aspect-ratio:4/4.2;max-width:100%;overflow:hidden;background:var(--panel)}
.ph img{width:100%;height:100%;object-fit:cover;transition:transform .8s var(--ease)}
.person:hover .ph img{transform:scale(1.05)}
.ph .lt{position:absolute;left:12px;top:12px;font-size:.74rem;font-weight:500;background:rgba(255,255,255,.94);padding:4px 10px;border-radius:999px}
.pb{padding:18px 18px 20px}
.pb h3{font-size:1.1rem}
.pb .role{color:var(--gold);font-size:.9rem;font-weight:500;margin-top:2px}
.pb dl{margin:14px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:.85rem;padding-top:14px;border-top:1px solid var(--line)}
.pb dt{color:var(--ink-3)}
.pb dd{margin:0;text-align:right}
.pb .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.note{margin-top:18px}

/* pricing */
.pricing{background:var(--panel)}
.price-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:stretch}
.plan{background:var(--green);color:#fff;border-radius:22px;padding:clamp(28px,3.4cqi,40px);display:flex;flex-direction:column;position:relative;overflow:hidden}
.plan h3{font-size:1.3rem}
.price{display:flex;align-items:baseline;gap:10px;margin:18px 0 6px;flex-wrap:wrap}
.price b{font-size:clamp(3.4rem,6cqi,4.6rem);font-weight:500;letter-spacing:-.05em;line-height:1;font-variant-numeric:tabular-nums;font-family:"Geist",sans-serif}
.price span{font-size:1rem;color:rgba(255,255,255,.7)}
.plan .when-pay{color:rgba(255,255,255,.75);font-size:.92rem}
.plan .checks{margin:26px 0 30px;padding-top:22px;border-top:1px solid rgba(255,255,255,.18)}
.plan .checks svg{stroke:var(--gold-hi)}
.plan .btn{margin-top:auto;align-self:flex-start}
.side-p{display:grid;gap:16px;align-content:start}
.box{background:#fff;border:1px solid var(--line);border-radius:22px;padding:28px}
.box h3{font-size:1.2rem;margin-bottom:8px}
.box p{color:var(--ink-2);font-size:.95rem}
.weeks{display:flex;gap:6px;margin:16px 0 14px;flex-wrap:wrap}
.weeks button{flex:1;min-width:70px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 8px;font:500 .86rem var(--f);color:var(--ink-2);cursor:pointer;transition:all .2s;text-align:center}
.weeks button:hover{border-color:var(--green)}
.weeks button[aria-selected="true"]{background:var(--green);border-color:var(--green);color:#fff}
.week-txt{min-height:3.2em;color:var(--ink);font-size:1rem!important}
.week-txt.enter{animation:up .3s var(--ease) both}
.not-inc{font-size:.88rem!important;color:var(--ink-3)!important}

/* faq */
.faq{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:clamp(32px,6cqi,96px);align-items:start}
.faq-photo{margin-top:32px;border-radius:20px;overflow:hidden;aspect-ratio:4/3;max-width:100%}
.faq-photo img{width:100%;height:100%;object-fit:cover}
.qa{border-top:1px solid var(--line)}
.qa:last-child{border-bottom:1px solid var(--line)}
.qa summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:20px;padding:20px 0;font-size:1.06rem;font-weight:500;letter-spacing:-.01em;transition:color .2s}
.qa summary:hover{color:var(--green)}
.qa summary::-webkit-details-marker{display:none}
.qa summary svg{width:20px;height:20px;flex:none;transition:transform .3s var(--ease);color:var(--green)}
.qa[open] summary svg{transform:rotate(45deg)}
.qa p{color:var(--ink-2);padding:0 40px 22px 0;max-width:40em}
.qa[open] p{animation:up .35s var(--ease) both}

/* closing */
.close{background:var(--green);color:#fff;position:relative;overflow:hidden}
.close-in{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:clamp(32px,5cqi,80px);align-items:center;position:relative;z-index:1}
.close h2{font-size:clamp(2.3rem,4.4cqi,4.2rem);letter-spacing:-.03em;line-height:1.05}
:lang(ko) .close h2{font-size:clamp(1.9rem,3.4cqi,3.1rem)}
.close h2 .ln{display:block}
.close .sub{color:rgba(255,255,255,.78);margin-top:22px}
.close .fee-line{margin-top:26px;display:inline-flex;gap:10px;align-items:center;padding:10px 16px;border-radius:999px;border:1px solid rgba(255,255,255,.22);font-size:.92rem}
.close .fee-line b{color:var(--gold-hi);font-weight:500}
.mark{position:absolute;right:-4%;top:50%;height:135%;width:auto;max-width:none;transform:translateY(-50%) rotate(-8deg);opacity:.08;pointer-events:none;transition:transform 1.6s var(--ease),opacity 1.6s var(--ease)}
.close.pre-o .mark{transform:translateY(-46%) rotate(-20deg);opacity:0}
.form{background:#fff;color:var(--ink);border-radius:20px;padding:28px;display:grid;grid-template-columns:1fr 1fr;gap:14px 14px;position:relative}
.ff{display:grid;gap:6px;align-content:start;min-width:0}
.ff.full{grid-column:1/-1}
.ff label,.ff .lbl{font-size:.84rem;font-weight:500}
.ff input,.ff select,.ff textarea{min-height:46px;border-radius:12px;border:1px solid var(--line);background:#fff;padding:0 14px;font:400 .96rem var(--f);color:var(--ink);width:100%;transition:border-color .2s,box-shadow .2s}
.ff textarea{padding:12px 14px;min-height:86px;resize:vertical;line-height:1.5}
.ff input:focus,.ff select:focus,.ff textarea:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(35,68,41,.12)}
.ff [aria-invalid="true"]{border-color:var(--err)}
.ff .err{font-size:.78rem;color:var(--err);min-height:0}
.consent{grid-column:1/-1;display:flex;gap:10px;align-items:flex-start;font-size:.84rem;color:var(--ink-2);line-height:1.45;cursor:pointer}
.consent input{width:18px;height:18px;margin:2px 0 0;accent-color:var(--green);flex:none}
.consent a{color:var(--green)}
.hp{position:absolute!important;left:-9999px!important;width:1px;height:1px;overflow:hidden}
.form .btn{grid-column:1/-1}
.msg{grid-column:1/-1;font-size:.86rem;color:var(--err);min-height:1.3em}
.thanks{background:#fff;color:var(--ink);border-radius:20px;padding:36px;display:grid;gap:14px;animation:up .45s var(--ease) both}
.thanks .ok-ic{width:48px;height:48px;border-radius:50%;background:var(--ok-bg);display:grid;place-items:center}
.thanks .ok-ic svg{width:24px;height:24px;stroke:var(--ok);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.thanks h3{font-size:1.5rem}
.thanks p{color:var(--ink-2)}
.thanks .fine{margin-top:4px}
.thanks .btn{justify-self:start}

/* footer */
.foot{padding-block:72px 0}
.foot-top{display:grid;grid-template-columns:minmax(0,1.4fr) repeat(3,minmax(0,1fr));gap:32px}
.foot-top p{color:var(--ink-2);margin-top:16px;max-width:24em;font-size:.95rem}
.foot-logo{width:150px;height:auto}
.foot h4{margin:0 0 14px;font-weight:500;font-size:.92rem;font-family:var(--f)}
.foot ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.foot ul a{text-decoration:none;color:var(--ink-2);font-size:.94rem;transition:color .2s}
.foot ul a:hover{color:var(--green)}
.giant{display:block;width:100%;height:auto;margin-top:64px;max-width:100%;opacity:.14}
.foot-bot{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-top:40px;padding-block:22px;border-top:1px solid var(--line);font-size:.84rem;color:var(--ink-3)}

/* reveal */
.js .rv{transition:opacity .9s var(--ease),transform .9s var(--ease);transition-delay:var(--d,0s)}
.js .rv.pre{opacity:0;transform:translateY(26px)}
.par{will-change:transform}
[data-i]{transition:opacity .2s}
.swap [data-i]{opacity:.2}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(.35em)}to{opacity:1;transform:none}}
@keyframes mq{to{transform:translateX(-50%)}}
@keyframes card{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.hero h1 .l{animation:rise .9s var(--ease) both}
.hero h1 .l:nth-child(2){animation-delay:.1s}
.hero .sub,.hero .terms,.hero .cta,.persona{animation:up .8s var(--ease) .3s both}
.photo{animation:up 1s var(--ease) .2s both}
.done-card{animation:card 1s var(--ease) .7s both}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.js .rv.pre{opacity:1;transform:none}}

@container page (max-width:1120px){

}

  .links.open a{display:block;padding:12px;font-size:1rem;color:var(--ink)}

}

}

  faq:[["How does pay work?","You hire your team member directly and pay them directly. Their pay is separate from LEVERA’s one-time $2,499 recruitment fee."],
       ["How long does recruiting take?","We aim to present your shortlist in about two weeks. That’s a target, not a guarantee, and some roles take longer."],
       ["Is $600 a month the real cost?","Some roles may be around $600 a month. Pay depends on hours, country, role and experience, and we’ll agree on a realistic budget with you."],

       ["Who is the employer?","You are. You hire directly and manage your team member’s work. LEVERA finds, vets and introduces the right person."],
       ["What happens after the hire?","We check in once a week for four weeks: onboarding, communication, feedback and a final handoff. There’s no ongoing agency fee."],

    const b = $('mailBody');
    b.innerHTML = `<div><h4>${T['rep.done']}</h4>${ul(done,'')}</div>${prog.length?`<div><h4>${T['rep.prog']}</h4>${ul(prog,'p')}</div>`:''}<div><h4>${T['rep.dec']}</h4>${dec.length?ul(dec,'d'):`<p class="none">${T['rep.none']}</p>`}</div>`;
    if (anim && !reduce) { b.classList.remove('enter'); void b.offsetWidth; b.classList.add('enter'); }
  };
  $('days').addEventListener('click', e => { const b = e.target.closest('[data-d]'); if (!b) return; S.day = +b.dataset.d;
    $('days').querySelectorAll('button').forEach(x => x.setAttribute('aria-selected', x === b));
    $('taskList').querySelectorAll('li').forEach((li, i) => li.classList.toggle('today', T.weekly[i][2].includes(S.day)));
    renderMail(true); });
  $('taskList').addEventListener('change', e => { const i = +e.target.dataset.i2; e.target.checked ? S.done.add(i) : S.done.delete(i); });

  /* ---------- calculator ---------- */
  const hrs = $('hrs'), rate = $('rate'), money = n => '$' + Math.round(n).toLocaleString('en-US'), last = {};
  const tween = (el, to, f) => { const from = last[el.id] ?? to; last[el.id] = to; if (reduce || from === to) { el.textContent = f(to); return; } const t0 = performance.now(); const st = now => { const k = Math.min(1, (now - t0) / 450), e = 1 - Math.pow(1-k, 3); el.textContent = f(from + (to-from)*e); if (k < 1) requestAnimationFrame(st); }; requestAnimationFrame(st); };
  const fill = el => el.style.setProperty('--p', (el.value - el.min) / (el.max - el.min) * 100 + '%');
  const calc = () => { const h = +hrs.value, r = +rate.value, year = h*48, val = year*r, cost = S.sal*12;
    $('hrsOut').textContent = fmt(T['calc.hrs'], {n:h}); $('rateOut').textContent = '$' + r;
    tween($('yearHrs'), year, n => Math.round(n).toLocaleString('en-US')); tween($('valOut'), val, money); tween($('costOut'), cost, money);
    $('rSub').textContent = fmt(T['calc.rsub'], {w: Math.round(year/40)});
    $('salName').textContent = fmt(T['calc.salName'], {s: money(S.sal)});
    const max = Math.max(val, cost); $('barVal').style.width = val/max*100 + '%'; $('barCost').style.width = Math.max(3, cost/max*100) + '%';
    $('verdict').textContent = val > (cost + 2499) * 1.2 ? T['calc.v1'] : T['calc.v2'];
    fill(hrs); fill(rate); };
  [hrs, rate].forEach(el => el.addEventListener('input', calc));
  $('sal').addEventListener('click', e => { const b = e.target.closest('[data-s]'); if (!b) return; S.sal = +b.dataset.s; $('sal').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b)); calc(); });

  /* ---------- steps ---------- */
  const sw = $('steps');
  const renderSteps = () => { $('stepList').innerHTML = T.steps.map(([h, p, w], i) => `<li class="step"><span class="n">${i+1}</span><h3>${esc(h)}</h3><p>${esc(p)}</p><span class="when">${esc(w)}</span></li>`).join(''); prog(); };
  const prog = () => { const r = sw.getBoundingClientRect(), vh = innerHeight; const p = Math.max(0, Math.min(1, (vh * .8 - r.top) / (r.height + vh * .3)));
    sw.style.setProperty('--prog', (p * 100) + '%'); const st = [...sw.querySelectorAll('.step')]; st.forEach((s, i) => s.classList.toggle('on', p >= i / st.length + .02)); };

  /* ---------- people ---------- */
  const renderPeople = () => { $('people').innerHTML = T.people.map(([n, f, role, eng, exp, hrsZ, tools], i) => `<article class="person" tabindex="0"><div class="ph"><img src="img/${f}.webp" alt="${esc(n)}" loading="lazy"><span class="lt">${T['ppl.badge']}</span></div>
    <div class="pb"><h3>${esc(n)}</h3><p class="role">${esc(role)}</p><dl><dt>${T['ppl.eng']}</dt><dd>${esc(eng)}</dd><dt>${T['ppl.exp']}</dt><dd>${esc(exp)}</dd><dt>${T['ppl.hours']}</dt><dd>${esc(hrsZ)}</dd></dl><div class="tags">${tools.map(t => `<span class="chip">${t}</span>`).join('')}</div></div></article>`).join(''); };

  /* ---------- pricing ---------- */
  const renderPricing = () => {
    $('prList').innerHTML = T.incl.map(x => `<li>${check}${esc(x)}</li>`).join('');
    $('weeks').setAttribute('aria-label', T['pr.qaH']);
    $('weeks').innerHTML = T.weeks.map((_, i) => `<button type="button" role="tab" aria-selected="${i===S.week}" data-w="${i}">${fmt(T['pr.wk'], {n:i+1})}</button>`).join('');
    $('weekTxt').textContent = T.weeks[S.week];
  };
  $('weeks').addEventListener('click', e => { const b = e.target.closest('[data-w]'); if (!b) return; S.week = +b.dataset.w; $('weeks').querySelectorAll('button').forEach(x => x.setAttribute('aria-selected', x === b)); const t = $('weekTxt'); t.textContent = T.weeks[S.week]; if (!reduce) { t.classList.remove('enter'); void t.offsetWidth; t.classList.add('enter'); } });

  /* ---------- faq ---------- */
  const renderFaq = () => { $('faqList').innerHTML = T.faq.map(([q, a], i) => `<details class="qa"${i===S.faq?' open':''} data-q="${i}"><summary>${esc(q)}${icon('i-plus')}</summary><p>${esc(a)}</p></details>`).join('');
    document.querySelectorAll('.qa').forEach(d => d.addEventListener('toggle', () => { if (d.open) { S.faq = +d.dataset.q; document.querySelectorAll('.qa').forEach(o => { if (o !== d) o.open = false; }); } else if (S.faq === +d.dataset.q) S.faq = -1; })); };

  /* ---------- form ---------- */
  const form = $('form'), msg = $('msg'), F = id => $(id);
  const fillSelect = (sel, opts) => { const i = sel.selectedIndex; sel.innerHTML = opts.map(o => `<option>${esc(o)}</option>`).join(''); sel.selectedIndex = i < 0 ? 0 : i; };
  const DRAFT = ['f-name','f-biz','f-email','f-phone','f-req'];
  try { const d = JSON.parse(store.get('levera-draft') || '{}'); DRAFT.forEach(id => { if (d[id]) F(id).value = d[id]; }); ['f-role','f-budget'].forEach(id => { if (d[id] != null) F(id).dataset.idx = d[id]; }); } catch {}
  form.addEventListener('input', () => { const d = {}; DRAFT.forEach(id => d[id] = F(id).value); d['f-role'] = F('f-role').selectedIndex; d['f-budget'] = F('f-budget').selectedIndex; store.set('levera-draft', JSON.stringify(d));
    ['name','biz','email'].forEach(k => { const el = F('f-'+k); if (el.getAttribute('aria-invalid') === 'true' && el.value.trim()) { el.removeAttribute('aria-invalid'); $('e-'+k).textContent=''; } }); });
  const errs = {};
  const validate = () => { const out = [];
    const chk = (k, ok) => { const el = F('f-'+k); el.setAttribute('aria-invalid', !ok); $('e-'+k).textContent = ok ? '' : T['e.'+k]; errs[k] = !ok; if (!ok) out.push(el); };
    chk('name', !!F('f-name').value.trim()); chk('biz', !!F('f-biz').value.trim()); chk('email', /^\S+@\S+\.\S+$/.test(F('f-email').value.trim()));
    const pv = F('f-privacy').checked; errs.privacy = !pv; if (!pv) out.push(F('f-privacy'));
    msg.textContent = out.length ? (pv ? T['e.check'] : T['e.privacy']) : ''; return out; };
  form.addEventListener('submit', e => { e.preventDefault(); if (F('f-web').value) return;
    const bad = validate(); if (bad.length) { bad[0].focus(); return; }
    S.sent = true; showThanks(); });
  const showThanks = () => { form.hidden = true; const t = $('thanks'); t.hidden = false;
    t.querySelector('h3').textContent = fmt(T['ty.h'], {name: F('f-name').value.trim().split(/\s+/)[0] || ''}); t.focus({preventScroll:true}); };
  $('again').addEventListener('click', () => { S.sent = false; $('thanks').hidden = true; form.hidden = false; F('f-name').focus(); });

  /* ---------- apply language ---------- */
  const applyLang = (lang, user) => {
    S.lang = lang; T = I18N[lang]; store.set('levera-lang', lang);
    document.documentElement.lang = lang;
    document.title = T['meta.title'];
    const md = document.querySelector('meta[name="description"]'); if (md) md.content = T['meta.desc'];
    document.querySelectorAll('[data-lang]').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === lang));
    document.querySelectorAll('[data-i]').forEach(el => { const v = T[el.dataset.i]; if (v != null) el.innerHTML = v; });
    document.querySelectorAll('[data-ip]').forEach(el => el.placeholder = T[el.dataset.ip]);
    document.querySelectorAll('[data-ia]').forEach(el => el.setAttribute('aria-label', T[el.dataset.ia]));
    document.querySelectorAll('[data-ialt]').forEach(el => el.alt = T[el.dataset.ialt]);
    renderSeg(); showInd(S.ind, false); renderTasks(); renderWeekly(); renderSteps(); renderPeople(); renderPricing(); renderFaq();
    fillSelect(F('f-role'), T.roles); fillSelect(F('f-budget'), T.budgets);
    ['f-role','f-budget'].forEach(id => { const el = F(id); if (el.dataset.idx != null) { el.selectedIndex = +el.dataset.idx; delete el.dataset.idx; } });
    ['name','biz','email'].forEach(k => { if (errs[k]) $('e-'+k).textContent = T['e.'+k]; });
    if (msg.textContent) msg.textContent = errs.privacy ? T['e.privacy'] : T['e.check'];
    if (S.sent) showThanks();
    calc();
    if (user && !reduce) { page.classList.add('swap'); requestAnimationFrame(() => requestAnimationFrame(() => page.classList.remove('swap'))); }
  };
  document.querySelectorAll('[data-lang]').forEach(b => b.addEventListener('click', () => { if (b.dataset.lang !== S.lang) applyLang(b.dataset.lang, true); }));
  applyLang(S.lang, false);

  /* hero: animate first card, then cycle industries until someone picks one */
  showInd(S.ind, true);
  if (!reduce) auto = setInterval(() => { const i = IND.indexOf(S.ind); showInd(IND[(i+1)%IND.length], true); }, 7000);

  /* ---------- reveals, parallax, closing mark ---------- */
  const closeSec = $('book');
  if (!reduce && 'IntersectionObserver' in window) {
    if (closeSec.getBoundingClientRect().top > innerHeight) { closeSec.classList.add('pre-o'); const oio = new IntersectionObserver(es => { if (es[0].isIntersecting) { closeSec.classList.remove('pre-o'); oio.disconnect(); } }, {threshold:.35}); oio.observe(closeSec); }
    const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.remove('pre'); io.unobserve(e.target); } }), {rootMargin:'0px 0px -8% 0px'});
    document.querySelectorAll('.rv').forEach(el => { if (el.getBoundingClientRect().top > innerHeight * .9) { el.classList.add('pre'); io.observe(el); } });
  }
  const pars = [...document.querySelectorAll('.par')]; let ticking = false;
  const onScroll = () => { if (ticking) return; ticking = true; requestAnimationFrame(() => { ticking = false; prog();
    if (!reduce) pars.forEach(p => { const r = p.parentElement.getBoundingClientRect(); const y = Math.max(-36, Math.min(36, (r.top + r.height/2 - innerHeight/2) * -(+p.dataset.speed))); p.style.transform = `translateY(${y}px) scale(1.12)`; }); }); };
  addEventListener('scroll', onScroll, {passive:true}); addEventListener('resize', onScroll); onScroll();
})();
</script>
</body>
</html>
